name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: make compile
      - run: make todo
      - run: make offline
      - run: make verify-negative
