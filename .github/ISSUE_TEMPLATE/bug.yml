name: Kit bug
description: The harness, a parser, or the doc is wrong
body:
  - type: input
    id: test
    attributes:
      label: Test name
    validations:
      required: true
  - type: input
    id: runid
    attributes:
      label: Run id
      description: Directory name under runs/
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
