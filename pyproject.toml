[project]
name = "redteam-kit"
version = "0.2.0"
description = "Repeatable black-hat-shaped test kit for DeepSeek V4.1 Flash"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
